spring:
  application:
    name: seata-account
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/seata-account?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: root
    password: 123456

server:
  port: 8083


mybatis-plus:
  # 多包名使用 例如 org.dromara.**.mapper,org.xxx.**.mapper
  mapperPackage: com.carl.**.mapper
  # 对应的 XML 文件位置
  mapperLocations: classpath*:mapper/**/*.xml
  # 实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: com.carl.**.domain,com.carl.**.model
  configuration:
    # 禁用二级缓存
    cach-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl


seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: create_order_group

  enable-auto-data-source-proxy: false

  # 事务分组到 TC 集群的映射，以及 TC 服务的真实地址
  service:
    vgroup-mapping:
      create_order_group: default
    grouplist:
      default: 127.0.0.1:8091